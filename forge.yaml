apiVersion: forge.agennext.io/v1alpha1
kind: AgentArtifact
metadata:
  name: hello-agent
  owner: AGenNext
  description: Minimal agent artifact contract for Agent Forge MVP.
spec:
  source:
    path: .

  build:
    strategy: docker
    image: localhost:5000/hello-agent:latest

  deploy:
    target: kubernetes
    namespace: agents
    port: 8080

  mvp:
    commands:
      - agent-forge init
      - agent-forge build
      - agent-forge deploy
    outputs:
      - oci-image
      - kubernetes-deployment
      - kubernetes-service
      - running-agent-pod
