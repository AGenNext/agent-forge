apiVersion: forge.agennext.io/v1alpha1
kind: ForgeArtifact
metadata:
  name: agent-forge
  owner: AGenNext
  description: Lightweight CNCF-first forge contract for DID-anchored agent-native artifacts.
spec:
  type: bundle

  anchor:
    primitive: identity
    standard: did
    required: true
    principle: no artifact, agent, action, release, or reconciliation is valid without a bound decentralized identifier.
    binds:
      - artifact
      - agent
      - skill
      - tool
      - workflow
      - policy
      - runtime
      - release
      - action
      - trace
      - approval
      - device
      - network
    proofs:
      - creator
      - owner
      - operator
      - approver
      - signer
      - publisher
      - deployer
      - runtime-subject
      - device-subject
      - network-subject

  deviceReadiness:
    required: true
    principle: the operating system makes each device enterprise-ready before it can run agent workloads.
    deviceAnchor: identity
    capabilities:
      - device-identity
      - enrollment
      - inventory
      - posture
      - attestation
      - policy
      - secrets
      - workload-isolation
      - remote-update
      - rollback
      - observability
      - audit
    lifecycle:
      - manufacture
      - enroll
      - attest
      - authorize
      - provision
      - run
      - monitor
      - update
      - quarantine
      - retire
    runtimeTargets:
      - laptop
      - workstation
      - server
      - edge-node
      - single-node-k3s
      - cluster-node

  globalNetworkReadiness:
    required: true
    principle: Kubernetes makes devices globally network-ready by turning enrolled devices into addressable, policy-controlled, service-discoverable nodes.
    substrate: kubernetes
    lightweightDefault: k3s
    capabilities:
      - node-identity
      - service-discovery
      - dns
      - ingress
      - egress-policy
      - network-policy
      - service-mesh-optional
      - workload-scheduling
      - remote-reconciliation
      - multi-cluster-ready
      - edge-ready
      - global-addressability
    resources:
      - Node
      - Namespace
      - Service
      - Ingress
      - NetworkPolicy
      - ServiceAccount
      - Secret
      - ConfigMap
      - CustomResourceDefinition
    agentResources:
      - AgentDevice
      - AgentNetwork
      - AgentRuntime
      - AgentRelease
    lifecycle:
      - join
      - discover
      - schedule
      - route
      - secure
      - reconcile
      - observe
      - update
      - drain
      - remove

  identity:
    standard: did
    credentials: verifiable-credentials
    required: true
    subjectTypes:
      - human
      - organization
      - agent
      - artifact
      - runtime
      - tool
      - device
      - network
    bindings:
      kubernetes:
        - service-account
        - namespace
        - workload
        - crd
        - node
        - network-policy
      oci:
        - artifact
        - image
        - signature
        - sbom
      git:
        - commit
        - tag
        - release
      device:
        - os
        - node
        - hardware
        - attestation
      network:
        - service
        - ingress
        - dns
        - endpoint
    lifecycle:
      - issued
      - active
      - suspended
      - rotated
      - revoked
      - archived

  agentNative:
    required: true
    primitives:
      - agent
      - identity
      - device
      - network
      - skill
      - tool
      - memory
      - knowledge
      - workflow
      - policy
      - model
      - runtime
      - configuration
      - secret
      - evaluation
      - trace
      - artifact
    lifecycle:
      - define
      - decompose
      - validate
      - compose
      - build
      - sign
      - publish
      - deploy
      - reconcile
      - observe
      - evaluate
      - improve

  orchestration:
    style: kubernetes-native
    lightweightDefault: k3s
    identityBound: true
    model:
      - crd
      - controller
      - reconciler
      - desired-state
      - status
      - finalizer
      - event
    resources:
      - AgentIdentity
      - AgentDevice
      - AgentNetwork
      - Agent
      - AgentSkill
      - AgentTool
      - AgentMemory
      - AgentWorkflow
      - AgentPolicy
      - AgentRuntime
      - AgentEvaluation
      - AgentRelease
    principle: agent artifacts are DID-bound Kubernetes resources, not only deployed containers.

  source:
    standard: git
    providerNeutral: true
    repository: https://github.com/AGenNext/agent-forge

  build:
    standard: cloud-native-buildpacks
    output: oci

  package:
    standard: oci
    artifactTypes:
      - agent
      - skill
      - workflow
      - policy
      - runtime
      - connector
      - bundle

  registry:
    standard: oci-distribution
    lightweightDefault: zot
    enterpriseDefault: harbor
    required: true

  deploy:
    target: kubernetes
    lightweightDefault: k3s
    packageManager: helm

  gitops:
    lightweightDefault: flux
    supported:
      - flux
      - argocd

  runtimeConfig:
    standard: openfeature

  policy:
    engine: opa

  observability:
    standard: opentelemetry

  cncfFirst:
    required: true
    baseline:
      - kubernetes
      - k3s
      - helm
      - cloud-native-buildpacks
      - oci
      - zot
      - harbor
      - flux
      - argocd
      - openfeature
      - opa
      - opentelemetry

  optionalIntegrations:
    gitProviders:
      - github
      - gitlab
      - forgejo
      - gitea
      - self-hosted-git
    authorization:
      - openfga
      - authzen
    enterpriseIdentity:
      - sso
      - scim
